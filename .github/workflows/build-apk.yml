# Codespaces yerine GitHub'ın kendi sunucusunda APK derlemek için (ücretsiz).
# GitHub > Actions > "APK derle" > Run workflow. Bittiğinde "PulseLink-apk" dosyasını indir.
name: APK derle
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: APK derle
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: PulseLink-apk
          path: app/build/outputs/apk/release/app-release.apk
